<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/template :: layout(~{::title},~{::body/content()})}"
>
  <head>
    <title>InvenTrack</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
  </head>

  <body>
	  

  
	<div class="card shadow mb-4">

		<div class="card-header py-3">
			<h6 class="m-0 font-weight-bold text-primary">在庫一覧</h6>
		</div>

		<div class="card-body">
			
			
			<!-- SVGアイコン定義 -->
			<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
				<symbol id="exclamation-triangle-fill" fill="currentColor" viewBox="0 0 16 16">
					<path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
				</symbol>
			 </svg>
	 		<!-- エラーメッセージの表示 -->
			<div th:if="${errorMsg != null}" class="alert alert-danger d-flex align-items-center custom-alert-compact" role="alert">
					<svg class="bi flex-shrink-0 me-2" role="img" aria-label="Danger:" width="16" height="16">
						<use href="#exclamation-triangle-fill" />
					</svg>
				<div>
					<p th:text="${errorMsg}" class="mb-0"></p>
				</div>
			</div>
			
			<!-- 検索フォーム -->
			<div class="search-container">
				<form class="search-container d-flex justify-content-center align-items-center" method="post" th:action="@{'/admin/stockList/search'}" th:object="${StockInfoSearchForm}" style="white-space: nowrap;">
					
					<!-- 検索条件 -->
					<div class="searchTerm">
						<label for="searchTerm" class="mr-2">検索条件</label>
					</div>
					
					<!-- 分類名 -->
 					<div class="d-flex align-items-center mr-3" style="width: 300px;">
	 					<label for="categoryName" class="mr-2">分類名</label>
	 					<select id="categoryName" name="categoryName" class="form-control mr-2">
							 <option value="">選択してください</option>
							 <option th:each="categoryList : ${categoryList}" 
							 	th:value="${categoryList.categoryName}" 
							 	th:text="${categoryList.categoryName}"></option>
						</select>
 					</div>
 					
					<!-- 部品名 -->
					<div class="d-flex align-items-center mr-3" style="width: 500px;">
						<label for="name" class="mr-2">部品名</label>
						<input type="text" id="name" name="name" class="form-control mr-2">
					</div>
 					
 					<!-- 在庫数 -->
					<div class="d-flex align-items-center mr-3">
						<label for="stockAmount" class="mr-2">在庫数</label>
						<input type="text" id="stockAmountFrom" name="stockAmountFrom" class="form-control mr-2">
						<span class="mr-2">〜</span>
						<input type="text" id="stockAmountTo" name="stockAmountTo" class="form-control mr-2">
					</div>
					
 					<button type="submit" class="btn btn-primary">検索</button>
 				</form>
			</div>
 			
			<!-- 一覧 -->
			<div class="table-responsive">
				<table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
					<thead>
						<tr>
							<th>分類</th>
							<th>名称</th>
							<th>個数</th>
							<th>保管場所</th>
							<th>部品詳細</th>
						</tr>
					</thead>
					<tbody>
			            <tr th:each="stock : ${stockList}">
							<td th:text="${stock.categoryName}">分類</td>
			                <td th:text="${stock.name}">名称</td>
			                <td th:text="${stock.amount}">個数</td>
			                <td th:text="${stock.centerName}">保管場所</td>
			                <td th:text="${stock.description}">部品詳細</td>
			            </tr>
					</tbody>
				</table>
			</div>
		</div>
	</div>
  </body>
</html>
