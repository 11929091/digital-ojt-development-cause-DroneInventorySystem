<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/template :: layout(~{::title},~{::body/content()})}"
>
  <head>
    <title>InvenTrack</title>
  </head>

  <body>
	<div class="card shadow mb-4">

		<div class="card-header py-3">
			<h6 class="m-0 font-weight-bold text-primary">在庫センター情報</h6>
		</div>

		<div class="card-body">
			
			<!-- SVGアイコン定義 -->
			<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
				<symbol id="exclamation-triangle-fill" fill="currentColor" viewBox="0 0 16 16">
					<path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
				</symbol>
			 </svg>
	 		<!-- エラーメッセージの表示 -->
			<div th:if="${errorMsg != null}" class="alert alert-danger d-flex align-items-center custom-alert-compact" role="alert">
					<svg class="bi flex-shrink-0 me-2" role="img" aria-label="Danger:" width="16" height="16">
						<use href="#exclamation-triangle-fill" />
					</svg>
				<div>
					<p th:text="${errorMsg}" class="mb-0"></p>
				</div>
			</div>
			
			<!-- 検索フォーム -->
			<div class="search-container">
				<form class="search-container d-flex justify-content-center align-items-center" method="post" th:action="@{'/admin/search'}" th:object="${CenterInfoForm}" style="white-space: nowrap;">
					
					<!-- 検索条件 -->
					<div class="searchTerm">
						<label for="searchTerm" class="mr-2">検索条件</label>
					</div>
					
					<!-- センター名 -->
					<div class="d-flex align-items-center mr-3" style="width: 500px;">
						<label for="centerName" class="mr-2">センター名</label>
						<input type="text" id="centerName" name="centerName" class="form-control mr-2">
					</div>
 					
 					<!-- 都道府県 -->
 					<div class="d-flex align-items-center mr-3">
	 					<label for="region" class="mr-2">都道府県</label>
	 					<select id="region" name="region" class="form-control mr-2">
							 <option value="">選択してください</option>
							 <option th:each="region : ${regions}" 
							 	th:value="${region.name}" 
							 	th:text="${region.name}"></option>
						</select>
 					</div>
 					
 					<!-- 容量 -->
					<div class="d-flex align-items-center mr-3">
						<label for="storageCapacity" class="mr-2">容量</label>
						<input type="text" id="storageCapacityFrom" name="storageCapacityFrom" class="form-control mr-2">
						<span class="mr-2">〜</span>
						<input type="text" id="storageCapacityTo" name="storageCapacityTo" class="form-control mr-2">
					</div>
					
 					<button type="submit" class="btn btn-primary">検索</button>
 				</form>
 			
			</div>
 			
			<!-- 在庫センター情報テーブル -->
			<div class="table-responsive">
				<table class="table table-bordered" id="dataTable" width="100%" cellspacing="0">
					<thead>
						<tr>
							<th>センター名</th>
							<th>住所</th>
							<th>連絡先</th>
							<th>管理者名</th>
							<th>最大保存容量(㎥)</th>
							<th>現在保存容量(㎥)</th>
							<th class="table-updateDelete"></th>
							<th class="table-updateDelete"></th>
						</tr>
					</thead>
					<tbody>
						<tr th:each="centerInfo : ${centerInfoList}">
							<td> [[${centerInfo.centerName}]] </td>
							<td> [[${centerInfo.address}]] </td>
							<td> [[${centerInfo.phoneNumber}]] </td>
							<td> [[${centerInfo.managerName}]] </td>
							<td> [[${centerInfo.maxStorageCapacity}]] </td>
							<td> [[${centerInfo.currentStorageCapacity}]] </td>
							<td class="table-updateDelete">
								<form method="post" th:action="@{'/admin/centerInfo/update/display/' + ${centerInfo.centerId}}">
									<input type="hidden" name="centerId" value="${centerInfo.centerId}" />
									<button type="submit" class="btn btn-secondary">編集</button>
								</form>
							</td>
							<td class="table-updateDelete">
								<form method="post" th:action="@{'/admin/centerInfo/delete/display/' + ${centerInfo.centerId}}">
									<input type="hidden" name="centerId" value="${centerInfo.centerId}" />
									<button type="submit" class="btn btn-danger">削除</button>
								</form>
							</td>
						</tr>
					</tbody>
				</table>
				<a th:href="@{centerInfo/register/display}" class="move">▶︎新規登録はこちら</a>
			</div>
		</div>
	</div>
  </body>
</html>
