<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/template :: layout(~{::title},~{::body/content()})}"
>
  <head>
    <title>InvenTrack</title>
  </head>

  <body>
	<div class="card shadow mb-4">

		<div class="card-header py-3">
			<h6 class="m-0 font-weight-bold text-primary">在庫センター情報</h6>
		</div>

		<div class="card-body">
			
			<!-- SVGアイコン定義 -->
			<svg xmlns="http://www.w3.org/2000/svg" style="display: none;">
				<symbol id="exclamation-triangle-fill" fill="currentColor" viewBox="0 0 16 16">
					<path d="M8.982 1.566a1.13 1.13 0 0 0-1.96 0L.165 13.233c-.457.778.091 1.767.98 1.767h13.713c.889 0 1.438-.99.98-1.767L8.982 1.566zM8 5c.535 0 .954.462.9.995l-.35 3.507a.552.552 0 0 1-1.1 0L7.1 5.995A.905.905 0 0 1 8 5zm.002 6a1 1 0 1 1 0 2 1 1 0 0 1 0-2z"/>
				</symbol>
			 </svg>
	 		<!-- エラーメッセージの表示 -->
			<div th:if="${errorMsg != null}" class="alert alert-danger d-flex align-items-center custom-alert-compact" role="alert">
					<svg class="bi flex-shrink-0 me-2" role="img" aria-label="Danger:" width="16" height="16">
						<use href="#exclamation-triangle-fill" />
					</svg>
				<div>
					<p th:text="${errorMsg}" class="mb-0"></p>
				</div>
			</div>
			
			<!-- 編集入力画面 -->
			<div class="form-container">
				<form class="register-container d-flex justify-content-center align-items-center" method="post" th:action="@{'/admin/centerInfo/update/' + ${centerInfo.centerId}}" th:object="${CenterInfo}" style="white-space: nowrap;">
					<p>センター名</p>
					<span><input type="text" id="centerName" name="centerName" class="form-control mr-2" th:value="${centerInfo.centerName}"></span>
					<p>郵便番号</p>
					<span><input type="text" id="postCode" name="postCode" class="form-control mr-2" th:value="${centerInfo.postCode}"></span>
					<p>住所</p>
					<span><input type="text" id="address" name="address" class="form-control mr-2" th:value="${centerInfo.address}"></span>
					<p>電話番号</p>
					<span><input type="text" id="phoneNumber" name="phoneNumber" class="form-control mr-2" th:value="${centerInfo.phoneNumber}"></span>
					<p>管理者名</p>
					<span><input type="text" id="managerName" name="managerName" class="form-control mr-2" th:value="${centerInfo.managerName}"></span>
					<p>最大容量</p>
					<span><input type="text" id="maxStorageCapacity" name="maxStorageCapacity" class="form-control mr-2" th:value="${centerInfo.maxStorageCapacity}"></span>
					<p>現在容量</p>
					<span><input type="text" id="currentStorageCapacity" name="currentStorageCapacity" class="form-control mr-2" th:value="${centerInfo.currentStorageCapacity}"></span>
					
 					<button type="submit" class="btn btn-primary">編集</button>
 				</form>
 				
			</div>
			<div class="table-responsive">
				<a th:href="@{/admin/centerInfo}" class="move">▶︎戻る</a>
			</div>
		</div>
	</div>
  </body>
</html>
