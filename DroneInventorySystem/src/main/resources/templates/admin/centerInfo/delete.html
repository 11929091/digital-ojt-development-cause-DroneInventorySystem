<!DOCTYPE html>
<html
  xmlns:th="http://www.thymeleaf.org"
  th:replace="~{layout/template :: layout(~{::title},~{::body/content()})}"
>
  <head>
    <title>InvenTrack</title>
  </head>

  <body>
	<div class="card shadow mb-4">

		<div class="card-header py-3">
			<h6 class="m-0 font-weight-bold text-primary">在庫センター情報</h6>
		</div>

		<div class="card-body">
			
			<!-- 削除確認画面 -->
			<div class="form-container">
				<form class="register-container d-flex justify-content-center align-items-center" method="post" th:action="@{'/admin/centerInfo/delete/' + ${centerInfo.centerId}}" th:object="${CenterInfo}" style="white-space: nowrap;">
					<p>センター名</p>
					<span class="border border-secondary p-2 rounded">[[${centerInfo.centerName}]]</span>
					<p>郵便番号</p>
					<span class="border border-secondary p-2 rounded">[[${centerInfo.postCode}]]</span>
					<p>住所</p>
					<span class="border border-secondary p-2 rounded">[[${centerInfo.address}]]</span>
					<p>電話番号</p>
					<span class="border border-secondary p-2 rounded">[[${centerInfo.phoneNumber}]]</span>
					<p>管理者名</p>
					<span class="border border-secondary p-2 rounded">[[${centerInfo.managerName}]]</span>
					<p>最大容量</p>
					<span class="border border-secondary p-2 rounded">[[${centerInfo.maxStorageCapacity}]]</span>
					<p>現在容量</p>
					<span class="border border-secondary p-2 rounded">[[${centerInfo.currentStorageCapacity}]]</span>
					
 					<button type="submit" class="btn btn-primary">削除</button>
 				</form>
 				
				<!-- エラーメッセージの表示 -->
				<div class="errorMsg">
					<div th:if="${errorMsg != null}" class="text-danger">
						<p th:text="${errorMsg}"></p>
					</div>
				</div>
 				
			</div>
			<div class="table-responsive">
				<a th:href="@{/admin/centerInfo}" class="move">▶︎戻る</a>
			</div>
		</div>
	</div>
  </body>
</html>
